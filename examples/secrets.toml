# Your secret bindings. This file is yours alone and never part of a pack.
# A pack only says it needs GITHUB_TOKEN; this file says where the value lives.
# NPM_TOKEN is left unbound, so the compile report lists it as a to-do.

GITHUB_TOKEN = { keychain = { service = "alias-deck", account = "github-token" } }

