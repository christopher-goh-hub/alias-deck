name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: bash,zsh,fish,pwsh
          - os: macos-latest
            shells: bash,zsh,fish,pwsh
          # Git Bash and pwsh come with the image. zsh and fish have no supported Windows build.
          - os: windows-latest
            shells: bash,pwsh
    env:
      # A shell the runner should have but does not fails the run instead of being skipped.
      ALIAS_DECK_REQUIRE_SHELLS: ${{ matrix.shells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
      - name: Install shells (macOS)
        if: runner.os == 'macOS'
        # bash 3.2 is /bin/bash; brew adds bash 5 so both run.
        run: brew install fish bash
      - name: Shell versions
        run: |
          for s in bash zsh fish pwsh; do printf '%s: ' "$s"; command -v "$s" || echo "not installed"; done
          /bin/bash --version | head -n 1 || true
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The release builds static Linux binaries; building one here catches a break before a tag does.
  musl:
    name: build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked -p alias-deck --target x86_64-unknown-linux-musl
      - run: |
          target/x86_64-unknown-linux-musl/release/alias-deck --version
          file target/x86_64-unknown-linux-musl/release/alias-deck | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
