format = 1

[pack]
name = "git-essentials"
version = "1.0.0"
license = "MIT"
description = "Short aliases for the Git commands you type all day: status, staging, commits, branches, sync, and history. In PowerShell, gc, gcm, gl, and gp replace the built-in aliases of the same names."
requires = ["git"]

[groups.status]
description = "Look before you leap"

[groups.status.aliases]
g = "git"
gs = "git status -sb"
gd = "git diff"
gds = "git diff --staged"
glog = "git log --oneline --graph --decorate -20"
glga = "git log --oneline --graph --decorate --all"

[groups.stage]
description = "Stage and unstage"

[groups.stage.aliases]
ga = "git add"
gaa = "git add --all"
gap = "git add --patch"
grs = "git restore"
grss = "git restore --staged"

[groups.commit]
description = "Commit and amend"

[groups.commit.aliases]
gc = "git commit"
gcm = "git commit -m"
gca = "git commit --amend"
gcan = "git commit --amend --no-edit"

[groups.branch]
description = "Branches, merges, and rebases"

[groups.branch.aliases]
gb = "git branch"
gsw = "git switch"
gswc = "git switch -c"
gm = "git merge"
grb = "git rebase"
grbi = "git rebase -i"
grbc = "git rebase --continue"
grba = "git rebase --abort"

[groups.sync]
description = "Talk to the remote"

[groups.sync.aliases]
gf = "git fetch --prune"
gl = "git pull"
gp = "git push"
gpf = "git push --force-with-lease"
gpu = "git push -u origin HEAD"

[groups.stash.aliases]
gst = "git stash"
gstp = "git stash pop"
gstl = "git stash list"

[groups.nav.functions.groot]
description = "cd to the top of the current Git repository"
shell.posix = 'cd -- "$(git rev-parse --show-toplevel)"'
shell.fish = 'cd -- (git rev-parse --show-toplevel)'
shell.pwsh = 'Set-Location -LiteralPath (git rev-parse --show-toplevel)'
